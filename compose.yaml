name: vitalis-ru
services:
  python:
    build:
      context: .
      dockerfile: Dockerfile.python
    restart: unless-stopped
    mem_limit: 384m
    environment:
      LLM_MODE: mock
      GIGACHAT_ENABLED: "false"
      DOCUMENT_ANALYSIS_ENABLED: "true"
      DOCUMENT_EXTERNAL_LLM_ENABLED: "false"
      INSURANCE_OFFICIAL_SEARCH_ENABLED: "true"
      VAULT_PATH: /app/vault
      FAISS_INDEX_PATH: /data/faiss
    volumes:
      - rag_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
  node:
    build:
      context: .
      dockerfile: Dockerfile.node
    restart: unless-stopped
    mem_limit: 128m
    environment:
      PORT: "3000"
      NODE_ENV: production
      PYTHON_API_URL: http://python:8000
    ports:
      - "127.0.0.1:3080:3000"
    volumes:
      - leads_data:/app/server/data
    depends_on:
      python:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  rag_data:
  leads_data:
