name: Vitalis checks

on:
  pull_request:
  push:
    branches:
      - main
      - feature/international-evidence-search

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r backend/requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: backend
          LLM_MODE: mock
          DOCUMENT_EXTERNAL_LLM_ENABLED: "false"
        run: python -m unittest discover -s backend/tests -v

  node-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check server and cabinet JavaScript
        run: |
          node --check server/index.js
          sed -n '/<script>/,/<\/script>/p' web/app.html | sed '1d;$d' | node --check -
