name: Vitalis checks

on:
  pull_request:
  push:
    branches:
      - main
      - feature/international-evidence-search

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1 ruff==0.14.2
          pip-audit -r backend/requirements.txt
      - name: Lint Python
        run: ruff check --select F,I backend/app backend/tests backend/evals
      - name: Run tests
        env:
          PYTHONPATH: backend
          LLM_MODE: mock
          DOCUMENT_EXTERNAL_LLM_ENABLED: "false"
        run: |
          python backend/evals/run_clinical_eval.py validate
          python backend/app/rag/source_registry.py validate vault/source_registry.json
          python -m unittest discover -s backend/tests -v

  node-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check server and cabinet JavaScript
        run: |
          node --check server/index.js
          sed -n '/<script>/,/<\/script>/p' web/app.html | sed '1d;$d' | node --check -
      - name: Test proxy routes and cabinet privacy
        run: node --test server/tests/*.test.js

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and start mock stack
        run: |
          docker compose build
          docker compose up -d --no-build --wait --wait-timeout 180
      - name: Verify container endpoints
        run: |
          python - <<'PY'
          import json
          from urllib.request import urlopen

          checks = {
              "http://127.0.0.1:3080/api/health": "vitalis-node",
              "http://127.0.0.1:3080/api/ai/health": "vitalis-python",
          }
          for url, expected_service in checks.items():
              with urlopen(url, timeout=10) as response:
                  payload = json.load(response)
              assert payload["ok"] is True, (url, payload)
              assert payload["service"] == expected_service, (url, payload)

          with urlopen("http://127.0.0.1:3080/app", timeout=10) as response:
              html = response.read().decode("utf-8")
          assert "<!doctype html" in html.lower()
          PY
      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200
      - name: Stop mock stack
        if: always()
        run: docker compose down --volumes --remove-orphans
